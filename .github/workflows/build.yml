name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the game
        run: |
          mkdir game
          unzip -q PixelDice.zip -d game

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: |
          cd game
          gradle assembleRelease --no-daemon

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDice-APK
          path: game/app/build/outputs/apk/release/PixelDice.apk
          if-no-files-found: error
